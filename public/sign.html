<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Sign your agreement</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 760px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
    .top { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
    .top b { font-size: 18px; }
    .doc { white-space: pre-wrap; font-size: 15.5px; line-height: 1.6; padding: 20px; }
    .pad-wrap { position: relative; border: 1.5px dashed var(--line); border-radius: 12px; background: #fff; touch-action: none; }
    .pad-wrap canvas { display: block; width: 100%; height: 180px; border-radius: 12px; cursor: crosshair; }
    .pad-hint { position: absolute; left: 16px; bottom: 44px; right: 16px; border-top: 1.5px solid #c9d1d9; pointer-events: none; }
    .pad-hint span { position: absolute; left: 0; top: 6px; font-size: 12px; color: #8a96a3; }
    .pad-wrap .clear { position: absolute; top: 8px; right: 8px; }
    .done { text-align: center; padding: 36px 20px; }
    .done .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; margin: 0 auto 14px; }
    .done .ok svg { width: 34px; height: 34px; }
    .step { font-size: 13px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; margin: 22px 0 8px; }
  </style>
</head>
<body>
  <div class="wrap" id="app"><div class="empty">Loading…</div></div>
  <script type="module" src="/js/sign.js"></script>
</body>
</html>
